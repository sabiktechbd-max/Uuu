name: Android release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APKs
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            file="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$file" ]; then cp "$file" "dist/"; fi
          done
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          test -s app-universal-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: private-agent-android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
